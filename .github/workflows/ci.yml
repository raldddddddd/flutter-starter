name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Generate, format, analyze, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localization and source
        run: |
          flutter gen-l10n
          dart run build_runner build
      - name: Verify generated code is committed
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            exit 1
          fi
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: dart analyze
      - name: Test
        run: flutter test

  android-dev:
    name: Android dev build
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json
      - name: Verify production release network build
        run: flutter build apk --release --flavor prod --dart-define-from-file=config/prod.json

  ios-dev:
    name: iOS dev no-codesign build
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign --flavor dev --dart-define-from-file=config/dev.json
